name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the pinned package manager
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: verify translations
        run: pnpm --filter web i18n:check
      - name: verify Cloud translations
        run: pnpm --filter cloud i18n:check
      - name: run unit tests
        run: pnpm --filter web test
      - name: run Cloud unit tests
        run: pnpm --filter cloud test
      - name: build the production bundle
        run: pnpm build
      - name: require the bundle entry point
        run: test -s apps/web/dist/index.html
      - name: build the Cloud production bundle
        run: pnpm --filter cloud build
      - name: require the Cloud bundle entry point
        run: test -s apps/cloud/dist/index.html
      - name: build the local Cloud development Web bundle
        env:
          TAPSTATE_LOCAL_DEVELOPMENT: 'true'
          VITE_CLOUD_CONSOLE_URL: http://localhost:28175
        run: pnpm --filter web exec vite build --mode cloud --outDir "$RUNNER_TEMP/tapstate-web-local-cloud"
      - name: verify the local Cloud Web build outputs
        run: |
          test -s "$RUNNER_TEMP/tapstate-web-local-cloud/index.html"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const marker = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'tapstate-web-local-cloud/tapstate-web-build.json'), 'utf8'))
          assert.deepEqual(marker, {
            schemaVersion: 1,
            profile: 'cloud',
            purpose: 'local-development',
            cloudConsoleUrl: 'http://localhost:28175/',
          })
          NODE
